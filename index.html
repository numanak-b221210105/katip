<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e7" />
    <meta name="description" content="Kâtip — konuşmayı cihazında yazıya döken, internete hiçbir şey göndermeyen not defteri. On-device speech-to-text notebook." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kâtip" />
    <title>Kâtip</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("katip.settings") || "{}");
        var d = s.theme === "dark" || ((!s.theme || s.theme === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Kâtip needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
